    <style>
      :root {
        --bg-color: #020617;
        --text-color: #e2e8f0;
        --glass-bg: rgba(15, 23, 42, 0.8);
        --border-color: rgba(255, 255, 255, 0.1);
      }
      .light {
        --bg-color: #f8fafc;
        --text-color: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.8);
        --border-color: rgba(0, 0, 0, 0.1);
      }
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .font-mono {
        font-family: 'Fira Code', monospace;
      }
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
      }
      .gradient-text {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .blob {
        position: absolute;
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(167, 139, 250, 0.15) 100%);
        filter: blur(80px);
        border-radius: 50%;
        z-index: -1;
      }
      /* Dark mode overrides for Tailwind classes if needed */
      .light .text-slate-400 { color: #64748b; }
      .light .text-slate-500 { color: #475569; }
      .light .bg-slate-900 { background-color: #f1f5f9; }
      .light .bg-slate-950 { background-color: #f8fafc; }
      .light .border-slate-800 { border-color: #e2e8f0; }
    </style>
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <!-- Script path is relative to the root for better deployment stability -->
    <script type="module" src="index.tsx"></script>
  </body>
